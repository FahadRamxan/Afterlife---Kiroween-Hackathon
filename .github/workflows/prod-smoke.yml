# GitHub Actions is off for this repo (the account is locked by billing). This file is kept as
# documentation of the checks. Run the same checks locally with: pnpm smoke:prod <url>
name: Prod smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: Production web URL, for example https://afterlife.vercel.app
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run @smoke tests against production
        working-directory: e2e
        env:
          BASE_URL: ${{ inputs.url }}
        run: pnpm exec playwright test
