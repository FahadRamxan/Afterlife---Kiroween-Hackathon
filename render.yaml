# Render Blueprint: https://render.com/docs/blueprint-spec
# Secrets use sync: false, so Render asks for them in the dashboard and they never live in git.
services:
  - type: web
    name: afterlife-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: WEB_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
      # Render's proxy sets X-Forwarded-For: per-IP rate limits need the real address.
      - key: TRUST_PROXY
        value: '1'
      - key: DATABASE_URL
        sync: false
      # Shown on "Show your work"; the same number as the worker's.
      - key: LLM_TOKEN_BUDGET
        value: '200000'
      # Spoken rule changes (Prompt 80): `transcribe` (Amazon Transcribe) or `none`.
      - key: SPEECH_PROVIDER
        sync: false
      - key: TRANSCRIBE_BUCKET
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # The Rebirth Certificate's public key (Prompt 71), from `pnpm cert:key`, published at
      # /.well-known/afterlife-key. Without it no certificate can be checked.
      - key: CERT_PUBLIC_KEY
        sync: false

  - type: worker
    name: afterlife-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    # Render has no free plan for background workers.
    plan: starter
    region: singapore
    envVars:
      - key: DATABASE_URL
        sync: false
      # The language model (Prompt 47, 80a): `bedrock`, `anthropic` or `none`.
      - key: LLM_PROVIDER
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # For LLM_PROVIDER=anthropic: the Claude API key.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_TOKEN_BUDGET
        value: '200000'
      # Seance voice notes (Prompt 80): `transcribe` or `none`.
      - key: SPEECH_PROVIDER
        sync: false
      - key: TRANSCRIBE_BUCKET
        sync: false
      # Signs the Rebirth Certificate (Prompt 71), from `pnpm cert:key`; on the worker only.
      # Without it proofs run but no certificate is issued.
      - key: CERT_SIGNING_KEY
        sync: false
